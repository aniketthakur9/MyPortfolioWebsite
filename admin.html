<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<style>

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#111;

    color:white;

    padding:40px;

}

h1{

    color:#b34747;

}

table{

    width:100%;

    border-collapse:collapse;

    margin-top:30px;

}

th,td{

    border:1px solid #333;

    padding:15px;

    text-align:left;

}

th{

    background:#6D1B1B;

}

tr:nth-child(even){

    background:#1b1b1b;

}
#searchInput{

    width:100%;

    padding:14px;

    margin:20px 0;

    border:none;

    border-radius:8px;

    background:#1f1f1f;

    color:white;

    font-size:16px;

    outline:none;

}

#searchInput:focus{

    border:2px solid #b34747;

}

</style>

</head>

<body>

<button id="logoutBtn">

Logout

</button>

<h1>Portfolio Contact Messages</h1>

<input
    type="text"
    id="searchInput"
    placeholder="🔍 Search by Name, Email or Subject..."
>

<table>

<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Subject</th>

<th>Message</th>

<th>Action</th>

</tr>

</thead>

<tbody id="messageTable">

</tbody>

</table>

<script src="admin.js"></script>

</body>

</html>

document.getElementById("logoutBtn").addEventListener("click", () => {

    localStorage.removeItem("token");

    window.location.href = "adminLogin.html";

});
