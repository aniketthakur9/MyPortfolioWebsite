<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body{

            background:#0d0d0d;

            color:white;

            display:flex;

            justify-content:center;

            align-items:center;

            height:100vh;

            font-family:Arial, Helvetica, sans-serif;

        }

        .login-box{

            width:400px;

            background:#181818;

            padding:35px;

            border-radius:15px;

            box-shadow:0 0 20px rgba(255,0,0,.15);

        }

        h1{

            text-align:center;

            margin-bottom:25px;

            color:#b34747;

        }

        input{

            width:100%;

            padding:14px;

            margin:10px 0;

            border:none;

            border-radius:8px;

            background:#242424;

            color:white;

            font-size:16px;

            box-sizing:border-box;

        }

        button{

            width:100%;

            padding:14px;

            border:none;

            border-radius:8px;

            background:#8b2323;

            color:white;

            font-size:16px;

            cursor:pointer;

            margin-top:15px;

        }

        button:hover{

            background:#a52a2a;

        }

    </style>

</head>

<body>

<div class="login-box">

<h1>Admin Login</h1>

<form id="loginForm">

<input
type="text"
id="username"
placeholder="Username"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

</div>

<script src="login.js"></script>

</body>

</html>
